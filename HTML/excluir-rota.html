<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BusView</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>BusView</h1>
  </header>

  <main>
    <h2>Excluir rota</h2>

    <form action="#" method="post">
      <label for="rota">Selecione a rota</label>
      <select id="rota" name="rota" required>
        <option value="">Escolha uma rota</option>
        <option value="exemplo">Rota de exemplo</option>
      </select>

      <button type="submit">Excluir rota</button>
    </form>

    <p><a href="index.html">Voltar</a></p>
  </main>
</body>
</html>
